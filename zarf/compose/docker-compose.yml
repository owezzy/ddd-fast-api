services:
  database:
    image: postgres:18.4-alpine3.22
    environment:
      POSTGRES_DB: ddd_fast_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d ddd_fast_api"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./pg_hba.conf:/etc/pg_hba.conf:ro
    command: ["-c", "hba_file=/etc/pg_hba.conf"]

  migrate:
    build:
      context: ../..
      dockerfile: zarf/Dockerfile
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      DDD_FAST_API_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@database:5432/ddd_fast_api

  api:
    build:
      context: ../..
      dockerfile: zarf/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DDD_FAST_API_APP_ENV: development
      DDD_FAST_API_APP_HOST: 0.0.0.0
      DDD_FAST_API_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@database:5432/ddd_fast_api
      DDD_FAST_API_CATALOG_REPOSITORY_BACKEND: sqlalchemy
      DDD_FAST_API_IDENTITY_REPOSITORY_BACKEND: sqlalchemy
      DDD_FAST_API_AUTH_SECRET: ${DDD_FAST_API_AUTH_SECRET:?set DDD_FAST_API_AUTH_SECRET in .env}
    ports:
      - "${API_HOST_PORT:-8000}:8000"

volumes:
  postgres-data:
