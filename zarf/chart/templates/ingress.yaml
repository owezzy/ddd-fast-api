{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ddd-fast-api.fullname" . }}
  labels:
    {{- include "ddd-fast-api.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- toYaml .Values.ingress.hosts | nindent 4 }}
{{- end }}
