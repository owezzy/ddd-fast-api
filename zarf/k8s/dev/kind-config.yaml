kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ddd-fast-api
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 8000
        hostPort: 8000
        protocol: TCP
      - containerPort: 5432
        hostPort: 5432
        protocol: TCP
