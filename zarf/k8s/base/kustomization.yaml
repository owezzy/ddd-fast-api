apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - service.yaml
  - deployment.yaml
  - migration-job.yaml
  - pdb.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: ddd-fast-api
      app.kubernetes.io/part-of: ddd-fast-api

images:
  - name: ghcr.io/owezzy/ddd-fast-api
    newName: ghcr.io/owezzy/ddd-fast-api
    newTag: "0.1.0"
