name: Quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Audit Python dependencies
        run: uv run pip-audit

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          ignore-unfixed: true

  delivery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Validate Compose configuration
        run: docker compose -f zarf/compose/docker-compose.yml config
        env:
          POSTGRES_PASSWORD: ci-compose-password
          DDD_FAST_API_AUTH_SECRET: ci-compose-auth-secret

      - name: Build production image
        run: docker build -f zarf/Dockerfile -t ddd-fast-api:ci .

      - name: Validate Helm chart
        run: |
          helm lint zarf/chart
          helm template ddd-fast-api zarf/chart --namespace ddd-fast-api >/tmp/ddd-fast-api.yaml

      - name: Validate Kustomize overlays
        run: |
          kubectl kustomize zarf/k8s/overlays/development >/tmp/ddd-fast-api-development.yaml
          kubectl kustomize zarf/k8s/overlays/production >/tmp/ddd-fast-api-production.yaml
          kubectl kustomize zarf/k8s/dev/database >/tmp/ddd-fast-api-database.yaml
