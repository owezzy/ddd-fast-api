<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 862.325 550" width="862.325" height="550" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 30%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="4.8" refX="8" refY="2.4" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.4, 0 4.8" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="4.8" refX="8" refY="2.4" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.4, 0 4.8" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line x1="70" y1="70" x2="70" y2="520" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="210" y1="70" x2="210" y2="520" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="357.075" y1="70" x2="357.075" y2="520" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="497.075" y1="70" x2="497.075" y2="520" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="637.075" y1="70" x2="637.075" y2="520" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="780.575" y1="70" x2="780.575" y2="520" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="70" y1="90" x2="210" y2="90" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="140" y="84" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">GET /catalog/items</text>
<polyline points="210,130 240,130 240,150 210,150" fill="none" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="246" y="140" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">Validate query and auth</text>
<line x1="210" y1="200" x2="357.075" y2="200" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="283.5375" y="194" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">List items(filter, page)</text>
<line x1="357.075" y1="240" x2="497.075" y2="240" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="427.075" y="234" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">Apply filtering and ordering rules</text>
<line x1="357.075" y1="280" x2="637.075" y2="280" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="497.07500000000005" y="274" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">Read matching items</text>
<line x1="637.075" y1="320" x2="780.575" y2="320" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="708.825" y="314" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">SELECT items</text>
<line x1="780.575" y1="360" x2="637.075" y2="360" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="708.825" y="354" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">Rows</text>
<line x1="637.075" y1="400" x2="357.075" y2="400" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="497.07500000000005" y="394" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">Domain entities</text>
<line x1="357.075" y1="440" x2="210" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="283.5375" y="434" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">Result page</text>
<line x1="210" y1="480" x2="70" y2="480" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="140" y="474" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">200 JSON response</text>
<rect x="375.7475" y="484" width="239.08" height="27" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<polygon points="608.8275,484 614.8275,490 608.8275,490" fill="var(--_inner-stroke)" />
<text x="495.2875" y="497.5" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">Errors are mapped at the HTTP boundary.</text>
<rect x="30" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="70" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Client</text>
<rect x="158.25" y="30" width="103.5" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="210" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Entrypoint</text>
<rect x="301.75" y="30" width="110.65" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="357.075" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Application</text>
<rect x="457.075" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="497.075" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Domain</text>
<rect x="585.325" y="30" width="103.5" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="637.075" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Repository</text>
<rect x="728.825" y="30" width="103.5" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="780.575" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">PostgreSQL</text>
</svg>